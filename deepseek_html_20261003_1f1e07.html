<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Angry Birds — Enhanced Edition</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
        height: 100%;
        overflow: hidden;
        font-family: 'Segoe UI', Tahoma, sans-serif;
        background: #0a0e27;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
    }

    body { display: flex; justify-content: center; align-items: center; }

    #gameWrap {
        position: relative;
        width: 100vw;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    canvas {
        display: block;
        border-radius: 14px;
        box-shadow:
            0 0 0 3px rgba(255,255,255,0.08),
            0 25px 70px rgba(0,0,0,0.65),
            0 0 120px rgba(120,180,255,0.15);
        cursor: grab;
        touch-action: none;
        max-width: 100%;
        max-height: 100%;
    }
    canvas:active { cursor: grabbing; }

    .hud {
        position: absolute;
        top: 22px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 14px;
        align-items: center;
        z-index: 10;
        pointer-events: none;
    }

    .pill {
        background: linear-gradient(180deg, rgba(255,255,255,0.95), rgba(230,240,255,0.9));
        border-radius: 40px;
        padding: 10px 22px;
        font-weight: 800;
        font-size: 17px;
        color: #1a2340;
        box-shadow: 0 6px 20px rgba(0,0,0,0.35), inset 0 -3px 0 rgba(0,0,0,0.08);
        display: flex;
        align-items: center;
        gap: 8px;
        letter-spacing: 0.5px;
        backdrop-filter: blur(8px);
    }

    .pill .icon { font-size: 20px; }
    #score { color: #e63946; font-size: 20px; }

    .controls {
        position: absolute;
        bottom: 24px;
        right: 24px;
        display: flex;
        gap: 12px;
        z-index: 10;
    }

    button.btn {
        border: none;
        border-radius: 14px;
        padding: 13px 24px;
        font-size: 15px;
        font-weight: 800;
        color: white;
        cursor: pointer;
        letter-spacing: 0.5px;
        box-shadow: 0 6px 0 rgba(0,0,0,0.25), 0 10px 25px rgba(0,0,0,0.35);
        transition: transform 0.12s, box-shadow 0.12s, filter 0.2s;
        display: flex;
        align-items: center;
        gap: 8px;
        font-family: inherit;
    }
    button.btn:hover { filter: brightness(1.1); }
    button.btn:active {
        transform: translateY(4px);
        box-shadow: 0 2px 0 rgba(0,0,0,0.25), 0 4px 12px rgba(0,0,0,0.3);
    }

    .btn-restart { background: linear-gradient(180deg, #ff8c42, #f4511e); }
    .btn-menu    { background: linear-gradient(180deg, #7e57c2, #4527a0); }
    .btn-sound   { background: linear-gradient(180deg, #4dabf7, #1971c2); min-width: 54px; justify-content: center; padding: 13px 18px; }
    .btn-play    { background: linear-gradient(180deg, #52b788, #2d6a4f); font-size: 18px; padding: 15px 42px; border-radius: 16px; }

    .hint {
        position: absolute;
        bottom: 24px;
        left: 24px;
        background: rgba(255,255,255,0.9);
        color: #1a2340;
        padding: 10px 18px;
        border-radius: 12px;
        font-size: 13px;
        font-weight: 700;
        box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        z-index: 10;
        max-width: 260px;
        line-height: 1.4;
        transition: opacity 0.5s;
    }

    .overlay {
        position: absolute;
        inset: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 50;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.4s;
        background: radial-gradient(circle at center, rgba(10,14,39,0.75), rgba(10,14,39,0.95));
        border-radius: 14px;
        padding: 20px;
    }
    .overlay.show { opacity: 1; pointer-events: auto; }

    .overlay-card {
        background: linear-gradient(180deg, #fffbf2, #ffe9c7);
        border-radius: 28px;
        padding: 42px 56px;
        text-align: center;
        box-shadow: 0 0 0 4px rgba(255,255,255,0.15), 0 30px 80px rgba(0,0,0,0.6);
        transform: scale(0.8);
        transition: transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
        max-width: 90vw;
    }
    .overlay.show .overlay-card { transform: scale(1); }

    .overlay-title {
        font-size: 42px;
        font-weight: 900;
        margin-bottom: 12px;
        background: linear-gradient(180deg, #ff9a3c, #e63946);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        letter-spacing: 1px;
    }

    .overlay-stars {
        font-size: 46px;
        margin: 14px 0 18px;
        letter-spacing: 6px;
        filter: drop-shadow(0 3px 6px rgba(0,0,0,0.25));
    }

    .overlay-score {
        font-size: 22px;
        font-weight: 800;
        color: #4a3b2a;
        margin-bottom: 26px;
    }
    .overlay-score span { color: #e63946; font-size: 28px; }

    .overlay-buttons {
        display: flex;
        gap: 14px;
        justify-content: center;
        flex-wrap: wrap;
    }

    .menu-screen {
        position: absolute;
        inset: 0;
        z-index: 100;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background: linear-gradient(180deg, #0a0e27 0%, #1a2151 30%, #3d4d8c 60%, #e8896b 100%);
        border-radius: 14px;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.5s;
        padding: 20px;
        overflow-y: auto;
    }
    .menu-screen.show { opacity: 1; pointer-events: auto; }

    .menu-title {
        font-size: 82px;
        font-weight: 900;
        background: linear-gradient(180deg, #ffd93d, #ff6b35, #e63946);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        text-align: center;
        filter: drop-shadow(0 6px 20px rgba(255,120,50,0.5));
        letter-spacing: 2px;
        margin-bottom: 6px;
        line-height: 1;
    }
    .menu-subtitle {
        font-size: 20px;
        color: rgba(255,255,255,0.75);
        font-weight: 600;
        letter-spacing: 6px;
        text-transform: uppercase;
        margin-bottom: 42px;
    }
    .menu-buttons {
        display: flex;
        flex-direction: column;
        gap: 16px;
        width: min(360px, 90%);
    }
    .menu-btn {
        border: none;
        border-radius: 18px;
        padding: 20px 32px;
        font-size: 20px;
        font-weight: 800;
        color: white;
        cursor: pointer;
        letter-spacing: 1px;
        font-family: inherit;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        transition: transform 0.15s, box-shadow 0.15s, filter 0.2s;
        box-shadow: 0 8px 0 rgba(0,0,0,0.3), 0 14px 30px rgba(0,0,0,0.4);
    }
    .menu-btn:hover { filter: brightness(1.12); transform: translateY(-2px); }
    .menu-btn:active { transform: translateY(6px); box-shadow: 0 2px 0 rgba(0,0,0,0.3), 0 4px 12px rgba(0,0,0,0.3); }
    .menu-btn.primary   { background: linear-gradient(180deg, #52b788, #2d6a4f); }
    .menu-btn.secondary { background: linear-gradient(180deg, #4dabf7, #1971c2); }
    .menu-btn.tertiary  { background: linear-gradient(180deg, #f5a623, #c87a00); }

    .levels-screen {
        position: absolute;
        inset: 0;
        z-index: 110;
        display: flex;
        flex-direction: column;
        align-items: center;
        background: linear-gradient(180deg, #1a2151 0%, #3d4d8c 50%, #7a6bb0 100%);
        border-radius: 14px;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.5s;
        padding: 30px 20px;
        overflow-y: auto;
    }
    .levels-screen.show { opacity: 1; pointer-events: auto; }

    .levels-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: min(900px, 100%);
        margin-bottom: 30px;
        flex-shrink: 0;
    }
    .levels-title {
        font-size: 46px;
        font-weight: 900;
        color: white;
        text-shadow: 0 4px 20px rgba(0,0,0,0.5);
        letter-spacing: 2px;
    }
    .btn-back {
        border: none;
        border-radius: 14px;
        padding: 12px 22px;
        font-size: 15px;
        font-weight: 800;
        color: white;
        cursor: pointer;
        font-family: inherit;
        background: linear-gradient(180deg, #7e57c2, #4527a0);
        box-shadow: 0 5px 0 rgba(0,0,0,0.3), 0 8px 20px rgba(0,0,0,0.3);
        transition: transform 0.12s;
    }
    .btn-back:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0,0,0,0.3); }

    .levels-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(155px, 1fr));
        gap: 18px;
        width: min(900px, 100%);
        padding-bottom: 20px;
    }

    .level-card {
        background: linear-gradient(180deg, #fffbf2, #ffd9a0);
        border-radius: 20px;
        padding: 18px 14px;
        text-align: center;
        cursor: pointer;
        transition: transform 0.2s, box-shadow 0.2s;
        box-shadow: 0 6px 0 rgba(120,80,40,0.5), 0 12px 25px rgba(0,0,0,0.35);
        position: relative;
        border: 3px solid rgba(255,255,255,0.5);
    }
    .level-card:hover { transform: translateY(-5px); box-shadow: 0 11px 0 rgba(120,80,40,0.5), 0 16px 32px rgba(0,0,0,0.4); }
    .level-card:active { transform: translateY(2px); box-shadow: 0 3px 0 rgba(120,80,40,0.5), 0 5px 10px rgba(0,0,0,0.3); }
    .level-card.locked { filter: grayscale(0.85) brightness(0.65); cursor: not-allowed; }
    .level-card.locked:hover { transform: none; }

    .level-num {
        font-size: 30px;
        font-weight: 900;
        color: #e63946;
        margin-bottom: 2px;
        text-shadow: 0 2px 4px rgba(0,0,0,0.15);
    }
    .level-name {
        font-size: 14px;
        font-weight: 800;
        color: #4a3b2a;
        margin-bottom: 10px;
        letter-spacing: 0.5px;
        min-height: 32px;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .level-birds {
        display: flex;
        gap: 5px;
        justify-content: center;
        margin-bottom: 10px;
        flex-wrap: wrap;
        min-height: 30px;
    }
    .bird-icon {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        position: relative;
        box-shadow: 0 3px 8px rgba(0,0,0,0.3), inset 0 -3px 6px rgba(0,0,0,0.2);
        border: 2px solid rgba(255,255,255,0.4);
    }
    .bird-icon.red    { background: radial-gradient(circle at 35% 30%, #ff8080, #c81e1e 70%, #7a0a0a); }
    .bird-icon.yellow { background: radial-gradient(circle at 35% 30%, #fff59d, #ffc107 70%, #a87a00); clip-path: polygon(100% 50%, 0 0, 0 100%); border-radius: 0; }
    .bird-icon.blue   { background: radial-gradient(circle at 35% 30%, #90caf9, #2196f3 70%, #0d47a1); }
    .bird-icon.black  { background: radial-gradient(circle at 35% 30%, #6c757d, #212529 70%, #000); }
    .bird-icon.white  { background: radial-gradient(circle at 35% 30%, #ffffff, #cfd8dc 70%, #90a4ae); }

    .bird-icon::before {
        content: '';
        position: absolute;
        width: 9px;
        height: 9px;
        background: white;
        border-radius: 50%;
        top: 32%;
        left: 24%;
        box-shadow: 7px 0 0 white;
    }
    .bird-icon::after {
        content: '';
        position: absolute;
        width: 4px;
        height: 4px;
        background: #000;
        border-radius: 50%;
        top: 40%;
        left: 30%;
        box-shadow: 7px 0 0 #000;
    }

    .level-stars {
        font-size: 18px;
        letter-spacing: 1px;
        filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
    }
    .level-lock {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 46px;
        filter: drop-shadow(0 4px 8px rgba(0,0,0,0.5));
    }

    .ability-indicator {
        position: absolute;
        bottom: 120px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(255,255,255,0.95);
        border-radius: 16px;
        padding: 12px 24px;
        font-weight: 800;
        font-size: 15px;
        color: #1a2340;
        box-shadow: 0 8px 25px rgba(0,0,0,0.4);
        z-index: 11;
        display: none;
        align-items: center;
        gap: 10px;
        animation: pulse 1.5s infinite;
        pointer-events: none;
    }
    .ability-indicator.show { display: flex; }
    @keyframes pulse {
        0%, 100% { transform: translateX(-50%) scale(1); }
        50% { transform: translateX(-50%) scale(1.05); }
    }

    @media (max-width: 700px) {
        .hint { display: none; }
        .overlay-card { padding: 32px 34px; }
        .overlay-title { font-size: 32px; }
        .overlay-stars { font-size: 34px; }
        .pill { padding: 8px 16px; font-size: 14px; }
        #score { font-size: 16px; }
        .controls { bottom: 14px; right: 14px; gap: 8px; }
        button.btn { padding: 10px 14px; font-size: 13px; }
        .menu-title { font-size: 52px; }
        .menu-subtitle { font-size: 14px; letter-spacing: 3px; }
        .menu-btn { padding: 16px 24px; font-size: 17px; }
        .levels-title { font-size: 30px; }
        .levels-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
        .level-card { padding: 14px 10px; }
        .level-num { font-size: 22px; }
        .level-name { font-size: 12px; min-height: 26px; }
        .bird-icon { width: 22px; height: 22px; }
    }
</style>
</head>
<body>

<div id="gameWrap">
    <canvas id="gameCanvas"></canvas>

    <div class="hud" id="hud" style="display:none;">
        <div class="pill"><span class="icon">⭐</span>Счёт: <span id="score">0</span></div>
        <div class="pill"><span class="icon">🎯</span>Уровень: <span id="levelNum">1</span></div>
    </div>

    <div class="hint" id="hint" style="display:none;">
        🎯 Потяни птицу и отпусти.<br>💥 Клик во время полёта — способность!
    </div>

    <div class="ability-indicator" id="abilityIndicator">
        <span id="abilityIcon">⚡</span>
        <span id="abilityText">Клик — способность!</span>
    </div>

    <div class="controls" id="controls" style="display:none;">
        <button class="btn btn-sound" id="soundBtn">🔊</button>
        <button class="btn btn-menu" id="menuBtn">☰ Меню</button>
        <button class="btn btn-restart" id="restartBtn">🔄</button>
    </div>

    <div class="overlay" id="overlay">
        <div class="overlay-card">
            <div class="overlay-title" id="overlayTitle">Победа!</div>
            <div class="overlay-stars" id="overlayStars">⭐⭐⭐</div>
            <div class="overlay-score">Очки: <span id="overlayScore">0</span></div>
            <div class="overlay-buttons">
                <button class="btn btn-play" id="playAgainBtn">🔄 Ещё раз</button>
                <button class="btn btn-menu" id="nextLevelBtn" style="display:none;">▶ Далее</button>
                <button class="btn btn-menu" id="overlayMenuBtn">🏠 Меню</button>
            </div>
        </div>
    </div>

    <div class="menu-screen show" id="menuScreen">
        <div class="menu-title">ANGRY BIRDS</div>
        <div class="menu-subtitle">Enhanced Edition</div>
        <div class="menu-buttons">
            <button class="menu-btn primary" id="playBtn">🎮 Играть</button>
            <button class="menu-btn secondary" id="levelsBtn">🗺️ Уровни</button>
            <button class="menu-btn tertiary" id="menuSoundBtn">🔊 Звук: Вкл</button>
        </div>
    </div>

    <div class="levels-screen" id="levelsScreen">
        <div class="levels-header">
            <div class="levels-title">Уровни</div>
            <button class="btn-back" id="backBtn">← Назад</button>
        </div>
        <div class="levels-grid" id="levelsGrid"></div>
    </div>
</div>

<script>
/* ============================================================
   ANGRY BIRDS — ENHANCED EDITION
   ============================================================ */

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const W = 1000;
const H = 640;
canvas.width = W;
canvas.height = H;

function resizeCanvas() {
    const maxW = window.innerWidth;
    const maxH = window.innerHeight;
    const scale = Math.min(maxW / W, maxH / H) * 0.96;
    canvas.style.width = (W * scale) + 'px';
    canvas.style.height = (H * scale) + 'px';
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

const scoreEl = document.getElementById('score');
const levelNumEl = document.getElementById('levelNum');
const hud = document.getElementById('hud');

/* ============================================================
   ТИПЫ ПТИЦ
   ============================================================ */
const BIRD_TYPES = {

        r: 21, ability: 'drop', abilityName: 'Бомба'
    }
};

/* ============================================================
   УРОВНИ
   ============================================================ */
const LEVELS = [

        ],

    {
        name: 'Разделённые',
        birds: ['blue', 'blue', 'red'],

function ensureAudio() {
    if (!audioCtx) {
        try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
        catch(e) { audioCtx = null; }
    }
}
function beep(freq, dur, type = 'sine', vol = 0.15, slideTo = null) {
    if (!soundEnabled || !audioCtx) return;
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, audioCtx.currentTime);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, audioCtx.currentTime + dur);
    g.gain.setValueAtTime(vol, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + dur);
}
const SFX = {
    launch:    () => beep(420, 0.18, 'sawtooth', 0.18, 780),
    hit:       () => beep(180, 0.09, 'square', 0.2, 90),
    pop:       () => { beep(700, 0.09, 'sine', 0.2, 1200); setTimeout(()=>beep(1200,0.1,'sine',0.15,500),60); },
    wood:      () => beep(240, 0.1, 'triangle', 0.18, 120),
    win:       () => { [523,659,784,1046].forEach((f,i)=>setTimeout(()=>beep(f,0.22,'triangle',0.16), i*120)); },
    lose:      () => { [400,320,240].forEach((f,i)=>setTimeout(()=>beep(f,0.28,'sine',0.16), i*160)); },
    pull:      () => beep(300, 0.05, 'sine', 0.08, 500),
    ability:   () => beep(600, 0.15, 'sawtooth', 0.2, 1400),
    split:     () => { [500,700,900].forEach((f,i)=>setTimeout(()=>beep(f,0.1,'triangle',0.14),i*40)); },
    explosion: () => { beep(80, 0.5, 'sawtooth', 0.35, 30); beep(200, 0.3, 'square', 0.2, 50); },
    dash:      () => beep(900, 0.2, 'sawtooth', 0.2, 1800)
};

/* ============================================================
   КЛАСС ПТИЦЫ
   ============================================================ */
class Bird {
    constructor(x, y, typeKey = 'red') {
        this.x = x; this.y = y;
        this.vx = 0; this.vy = 0;
        this.typeKey = typeKey;
        this.type = BIRD_TYPES[typeKey];
        this.r = this.type.r;
        this.angle = 0;
        this.angularVel = 0;
        this.launched = false;
        this.resting = false;
        this.trail = [];
        this.eyeBlink = 0;
        this.wingFlap = 0;
        this.hitCooldown = 0;
        this.abilityUsed = false;
        this.abilityActive = 0;
        this.isChild = false;
        this.pulse = 0;
    }

    launch(vx, vy) {
        this.vx = vx; this.vy = vy;
        this.launched = true;
        this.resting = false;
        this.angularVel = 0.18;
        SFX.launch();
        spawnFeathers(this.x, this.y, 6, this.type.color1);
        state.shake = 6;
    }

    activateAbility() {
        if (this.abilityUsed || !this.launched || this.resting) return false;
        const ab = this.type.ability;
        if (!ab) return false;
        this.abilityUsed = true;
        SFX.ability();
        state.shake = 5;

        if (ab === 'dash') {
            const speed = Math.hypot(this.vx, this.vy) || 1;
            const dirX = this.vx / speed;
            const dirY = this.vy / speed;
            this.vx = dirX * 22;
            this.vy = dirY * 22;
            this.abilityActive = 30;
            SFX.dash();
            for (let i = 0; i < 15; i++) {
                particles.push(new Particle(this.x - dirX * i * 5, this.y - dirY * i * 5, '#ffe066', {
                    vx: rand(-1, 1) - dirX * 2, vy: rand(-1, 1) - dirY * 2,
                    size: rand(4, 8), gravity: 0, decay: 0.04
                }));
            }
        } else if (ab === 'split') {
            for (let i = 0; i < 2; i++) {
                const nb = new Bird(this.x, this.y, 'blue');
                nb.isChild = true;
                nb.r = 12;
                nb.launched = true;
                const angle = Math.atan2(this.vy, this.vx) + (i === 0 ? -0.35 : 0.35);
                const spd = Math.hypot(this.vx, this.vy) * 0.95;
                nb.vx = Math.cos(angle) * spd;
                nb.vy = Math.sin(angle) * spd;
                nb.angularVel = 0.2;
                birds.push(nb);
            }
            SFX.split();
            spawnBurst(this.x, this.y, '#74c0fc', 12);
        } else if (ab === 'bomb') {
            this.explode();
        } else if (ab === 'drop') {
            const egg = new Egg(this.x, this.y + this.r, this);
            eggs.push(egg);
            this.vy -= 3;
            SFX.ability();
            spawnBurst(this.x, this.y + this.r, '#fff', 8);
        }
        return true;
    }

    explode() {
        SFX.explosion();
        state.shake = 25;
        const R = 130;

        for (let i = 0; i < 40; i++) {
            const a = rand(0, Math.PI * 2);
            const s = rand(3, 14);
            particles.push(new Particle(this.x, this.y, ['#ff6b35','#ffd93d','#ff3b30'][randInt(0,2)], {
                vx: Math.cos(a) * s, vy: Math.sin(a) * s - 2,
                size: rand(4, 12), gravity: 0.15, decay: rand(0.015, 0.03)
            }));
        }

        pigs.forEach(p => {
            if (p.dead) return;
            const d = dist(this.x, this.y, p.x, p.y);
            if (d < R) {
                p.damage(clamp(200 * (1 - d / R), 40, 200));
                const a = Math.atan2(p.y - this.y, p.x - this.x);
                p.vx += Math.cos(a) * 15;
                p.vy += Math.sin(a) * 15 - 3;
                p.resting = false;
            }
        });
        blocks.forEach(b => {
            if (b.hp <= 0) return;
            const bx = b.x + b.w / 2;
            const by = b.y + b.h / 2;
            const d = dist(this.x, this.y, bx, by);
            if (d < R) {
                b.damage(clamp(250 * (1 - d / R), 30, 250));
                const a = Math.atan2(by - this.y, bx - this.x);
                b.vx += Math.cos(a) * 12;
                b.vy += Math.sin(a) * 12 - 3;
                b.resting = false;
            }
        });

        this.resting = true;
        this.vx = 0; this.vy = 0;
    }

    update() {
        if (this.launched) {
            this.vy += GRAVITY;
            this.vx *= AIR; this.vy *= AIR;
            this.x += this.vx; this.y += this.vy;

            this.angularVel = lerp(this.angularVel, this.vx * 0.012, 0.15);
            this.angle += this.angularVel;

            if (Math.hypot(this.vx, this.vy) > 2) {
                this.trail.push({ x: this.x, y: this.y, a: 1, r: this.r, c: this.type.color2 });
                if (this.trail.length > 24) this.trail.shift();
            }
            this.trail.forEach(p => p.a *= 0.94);

            if (this.y + this.r >= GROUND_Y) {
                this.y = GROUND_Y - this.r;
                if (Math.abs(this.vy) > 1.5) {
                    SFX.hit();
                    state.shake = Math.min(10, Math.abs(this.vy));
                    spawnDust(this.x, GROUND_Y, 10);
                }
                this.vy *= -0.42;
                this.vx *= 0.72;
                this.angularVel *= 0.6;
                if (Math.abs(this.vy) < 1.2 && Math.abs(this.vx) < 1.2) {
                    this.vy = 0; this.vx = 0;
                    this.resting = true;
                }
            }

            if (this.x + this.r > W) { this.x = W - this.r; this.vx *= -0.5; }
            if (this.x - this.r < 0) { this.x = this.r; this.vx *= -0.5; }
            if (Math.abs(this.vx) < 0.15 && this.y + this.r >= GROUND_Y - 1 && Math.abs(this.vy) < 0.5) {
                this.resting = true;
            }
        } else {
            this.wingFlap += 0.08;
        }

        if (this.hitCooldown > 0) this.hitCooldown--;
        if (this.eyeBlink > 0) this.eyeBlink--; else if (Math.random() < 0.008) this.eyeBlink = 8;
        if (this.abilityActive > 0) this.abilityActive--;
        this.pulse += 0.15;
    }

    draw() {
        const t = this.type;
        const R = this.r;

        for (let i = 0; i < this.trail.length; i++) {
            const p = this.trail[i];
            const k = i / this.trail.length;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r * (0.3 + k * 0.6), 0, Math.PI * 2);
            ctx.fillStyle = `rgba(255,220,140,${p.a * 0.25 * k})`;
            ctx.fill();
        }

        if (this.abilityActive > 0) {
            const pulse = 1 + Math.sin(this.pulse * 2) * 0.15;
            const glow = ctx.createRadialGradient(this.x, this.y, R, this.x, this.y, R * 2.5 * pulse);
            glow.addColorStop(0, 'rgba(255,230,102,0.5)');
            glow.addColorStop(1, 'rgba(255,230,102,0)');
            ctx.fillStyle = glow;
            ctx.beginPath();
            ctx.arc(this.x, this.y, R * 2.5 * pulse, 0, Math.PI * 2);
            ctx.fill();
        }

        if (this.launched && !this.resting && !this.abilityUsed && t.ability) {
            const pulse = 0.7 + Math.sin(this.pulse * 3) * 0.3;
            ctx.beginPath();
            ctx.arc(this.x, this.y, R * 1.5 * pulse, 0, Math.PI * 2);
            ctx.strokeStyle = `rgba(255,255,255,${0.4 * pulse})`;
            ctx.lineWidth = 3;
            ctx.stroke();
        }

        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.angle);

        ctx.beginPath();
        ctx.ellipse(0, 4, R * 1.05, R * 1.0, 0, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(0,0,0,0.22)';
        ctx.fill();

        // Хвост (не для Чака)
        if (this.typeKey !== 'yellow') {
            ctx.beginPath();
            ctx.moveTo(-R * 0.7, -R * 0.3);
            ctx.lineTo(-R * 1.8, -R * 0.7);
            ctx.lineTo(-R * 1.6, 0);
            ctx.lineTo(-R * 1.9, R * 0.6);
            ctx.lineTo(-R * 0.7, R * 0.4);
            ctx.closePath();
            const tailGrad = ctx.createLinearGradient(-R*1.8, 0, -R*0.6, 0);
            tailGrad.addColorStop(0, t.color3);
            tailGrad.addColorStop(1, t.color2);
            ctx.fillStyle = tailGrad;
            ctx.fill();
            ctx.strokeStyle = t.color3;
            ctx.lineWidth = 1.5;
            ctx.stroke();
        }

        if (this.typeKey === 'yellow') {
            // === ТРЕУГОЛЬНОЕ ТЕЛО ЧАКА ===
            const tipX = R * 1.15;
            const backX = -R * 0.95;
            const topY = -R * 1.0;
            const botY = R * 1.0;

            const triGrad = ctx.createRadialGradient(-R*0.2, -R*0.3, R*0.2, 0, 0, R*1.2);
            triGrad.addColorStop(0, t.color1);
            triGrad.addColorStop(0.5, t.color2);
            triGrad.addColorStop(1, t.color3);

            ctx.beginPath();
            ctx.moveTo(tipX, 0);
            ctx.lineTo(backX, topY);
            ctx.lineTo(backX, botY);
            ctx.closePath();
            ctx.fillStyle = triGrad;
            ctx.fill();

            // Закруглённые задние углы
            ctx.beginPath();
            ctx.arc(backX + R*0.15, topY + R*0.05, R*0.2, 0, Math.PI * 2);
            ctx.fillStyle = t.color2;
            ctx.fill();
            ctx.beginPath();
            ctx.arc(backX + R*0.15, botY - R*0.05, R*0.2, 0, Math.PI * 2);
            ctx.fillStyle = t.color2;
            ctx.fill();

            // Блик сверху
            ctx.beginPath();
            ctx.moveTo(tipX - R*0.7, -R*0.3);
            ctx.lineTo(backX + R*0.3, -R*0.75);
            ctx.lineTo(backX + R*0.3, -R*0.35);
            ctx.closePath();
            ctx.fillStyle = 'rgba(255,255,255,0.4)';
            ctx.fill();

            // Обводка
            ctx.beginPath();
            ctx.moveTo(tipX, 0);
            ctx.lineTo(backX, topY);
            ctx.lineTo(backX, botY);
            ctx.closePath();
            ctx.strokeStyle = 'rgba(120,80,0,0.8)';
            ctx.lineWidth = 2;
            ctx.lineJoin = 'round';
            ctx.stroke();

            // Живот
            ctx.beginPath();
            ctx.moveTo(tipX - R*0.15, R*0.2);
            ctx.lineTo(backX + R*0.4, R*0.85);
            ctx.lineTo(backX + R*0.2, R*0.5);
            ctx.closePath();
            ctx.fillStyle = t.belly;
            ctx.fill();
        } else {
            // Круглое тело
            const bodyGrad = ctx.createRadialGradient(-R*0.35, -R*0.4, R*0.1, 0, 0, R*1.1);
            bodyGrad.addColorStop(0, t.color1);
            bodyGrad.addColorStop(0.5, t.color2);
            bodyGrad.addColorStop(1, t.color3);
            ctx.beginPath();
            ctx.arc(0, 0, R, 0, Math.PI * 2);
            ctx.fillStyle = bodyGrad;
            ctx.fill();

            ctx.beginPath();
            ctx.ellipse(-R*0.35, -R*0.45, R*0.4, R*0.28, -0.5, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255,255,255,0.4)';
            ctx.fill();

            ctx.beginPath();
            ctx.arc(0, 0, R, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(0,0,0,0.7)';
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.beginPath();
            ctx.ellipse(R*0.1, R*0.45, R*0.55, R*0.32, 0, 0, Math.PI * 2);
            ctx.fillStyle = t.belly;
            ctx.fill();
        }

        // Бровь
        ctx.beginPath();
        if (this.typeKey === 'yellow') {
            ctx.moveTo(-R*0.55, -R*0.5);
            ctx.lineTo(R*0.05, -R*0.7);
        } else {
            ctx.moveTo(-R*0.75, -R*0.55);
            ctx.lineTo(R*0.05, -R*0.75);
        }
        ctx.strokeStyle = 'rgba(0,0,0,0.85)';
        ctx.lineWidth = 3.5;
        ctx.lineCap = 'round';
        ctx.stroke();

        // Глаза
        const eyeOpen = this.eyeBlink > 0 ? 0.15 : 1;
        ctx.beginPath();
        ctx.ellipse(-R*0.2, -R*0.28, R*0.28, R*0.3 * eyeOpen, 0, 0, Math.PI * 2);
        ctx.fillStyle = 'white';
        ctx.fill();
        ctx.strokeStyle = 'rgba(0,0,0,0.6)';
        ctx.lineWidth = 1.5;
        ctx.stroke();
        ctx.beginPath();
        ctx.ellipse(R*0.28, -R*0.28, R*0.28, R*0.3 * eyeOpen, 0, 0, Math.PI * 2);
        ctx.fillStyle = 'white';
        ctx.fill();
        ctx.stroke();

        if (this.eyeBlink <= 0) {
            const lookX = clamp(this.vx * 0.05, -3, 3);
            const lookY = clamp(this.vy * 0.03, -3, 3);
            ctx.beginPath();
            ctx.arc(-R*0.2 + lookX, -R*0.25 + lookY, R*0.13, 0, Math.PI * 2);
            ctx.fillStyle = '#111';
            ctx.fill();
            ctx.beginPath();
            ctx.arc(R*0.28 + lookX, -R*0.25 + lookY, R*0.13, 0, Math.PI * 2);
            ctx.fillStyle = '#111';
            ctx.fill();
            ctx.beginPath();
            ctx.arc(-R*0.24 + lookX, -R*0.3 + lookY, R*0.05, 0, Math.PI * 2);
            ctx.fillStyle = 'white';
            ctx.fill();
            ctx.beginPath();
            ctx.arc(R*0.24 + lookX, -R*0.3 + lookY, R*0.05, 0, Math.PI * 2);
            ctx.fillStyle = 'white';
            ctx.fill();
        }

        // Клюв
        ctx.beginPath();
        ctx.moveTo(R*0.55, -R*0.05);
        ctx.lineTo(R*1.55, R*0.15);
        ctx.lineTo(R*0.55, R*0.42);
        ctx.closePath();
        const beakGrad = ctx.createLinearGradient(R*0.55, 0, R*1.55, 0);
        beakGrad.addColorStop(0, '#ffd93d');
        beakGrad.addColorStop(1, '#f7a11a');
        ctx.fillStyle = beakGrad;
        ctx.fill();
        ctx.strokeStyle = '#a86a00';
        ctx.lineWidth = 1.5;
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(R*0.6, R*0.15);
        ctx.lineTo(R*1.5, R*0.15);
        ctx.strokeStyle = 'rgba(140,80,0,0.6)';
        ctx.lineWidth = 1;
        ctx.stroke();

        // Хохолки
        drawHohol(ctx, R, this.typeKey, t, this.pulse);

        // Уникальные детали
        if (this.typeKey === 'black') {
            ctx.beginPath();
            ctx.moveTo(0, -R);
            ctx.quadraticCurveTo(5, -R*1.4, 10, -R*1.5);
            ctx.strokeStyle = '#8B4513';
            ctx.lineWidth = 3;
            ctx.stroke();
            const sparkR = 3 + Math.sin(this.pulse * 3) * 1.5;
            ctx.beginPath();
            ctx.arc(10, -R*1.5, sparkR, 0, Math.PI * 2);
            ctx.fillStyle = '#ffcc00';
            ctx.shadowColor = '#ff6b35';
            ctx.shadowBlur = 15;
            ctx.fill();
            ctx.shadowBlur = 0;
        }
        if (this.typeKey === 'white') {
            ctx.beginPath();
            ctx.ellipse(-R*0.5, -R*0.8, R*0.25, R*0.15, -0.8, 0, Math.PI * 2);
            ctx.fillStyle = '#ffffff';
            ctx.fill();
            ctx.strokeStyle = 'rgba(120,140,160,0.6)';
            ctx.lineWidth = 1;
            ctx.stroke();
        }

        ctx.restore();
    }
}

function drawHohol(ctx, R, typeKey, t, pulse) {
    if (typeKey === 'red') {
        ctx.beginPath();
        ctx.moveTo(-R*0.15, -R*0.95);
        ctx.quadraticCurveTo(-R*0.05, -R*1.6, R*0.35, -R*1.15);
        ctx.quadraticCurveTo(R*0.1, -R*1.3, R*0.25, -R*0.95);
        ctx.closePath();
        ctx.fillStyle = t.color2;
        ctx.fill();
        ctx.strokeStyle = t.color3;
        ctx.lineWidth = 1.2;
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(-R*0.5, -R*0.85);
        ctx.quadraticCurveTo(-R*0.6, -R*1.3, -R*0.15, -R*1.05);
        ctx.closePath();
        ctx.fillStyle = t.color2;
        ctx.fill();
        ctx.stroke();
    } else if (typeKey === 'yellow') {
        ctx.beginPath();
        ctx.moveTo(-R*0.4, -R*0.95);
        ctx.quadraticCurveTo(-R*0.55, -R*1.6, -R*0.15, -R*1.3);
        ctx.quadraticCurveTo(-R*0.25, -R*1.1, 0, -R*1.0);
        ctx.closePath();
        ctx.fillStyle = t.color1;
        ctx.fill();
        ctx.strokeStyle = t.color3;
        ctx.lineWidth = 1.2;
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(-R*0.05, -R*1.0);
        ctx.quadraticCurveTo(R*0.15, -R*1.65, R*0.5, -R*1.15);
        ctx.quadraticCurveTo(R*0.2, -R*1.2, R*0.3, -R*1.0);
        ctx.closePath();
        ctx.fillStyle = t.color1;
        ctx.fill();
        ctx.strokeStyle = t.color3;
        ctx.lineWidth = 1.2;
        ctx.stroke();
    } else if (typeKey === 'blue') {
        ctx.beginPath();
        ctx.moveTo(-R*0.2, -R*0.85);
        ctx.quadraticCurveTo(-R*0.1, -R*1.4, R*0.2, -R*1.0);
        ctx.closePath();
        ctx.fillStyle = t.color1;
        ctx.fill();
        ctx.strokeStyle = t.color3;
        ctx.lineWidth = 1;
        ctx.stroke();
    } else if (typeKey === 'white') {
        ctx.beginPath();
        ctx.moveTo(-R*0.15, -R*0.95);
        ctx.quadraticCurveTo(-R*0.3, -R*1.55, R*0.15, -R*1.2);
        ctx.quadraticCurveTo(R*0.0, -R*1.1, R*0.15, -R*0.95);
        ctx.closePath();
        ctx.fillStyle = '#ffffff';
        ctx.fill();
        ctx.strokeStyle = '#90a4ae';
        ctx.lineWidth = 1.2;
        ctx.stroke();
    }
}

/* ============================================================
   ЯЙЦО
   ============================================================ */
class Egg {
    constructor(x, y, parent) {
        this.x = x; this.y = y;
        this.vx = 0; this.vy = 2;
        this.r = 12;
        this.parent = parent;
        this.exploded = false;
    }
    update() {
        if (this.exploded) return;
        this.vy += GRAVITY;
        this.x += this.vx;
        this.y += this.vy;
        if (this.y + this.r >= GROUND_Y) { this.y = GROUND_Y - this.r; this.explode(); return; }
        for (const p of pigs) {
            if (p.dead) continue;
            if (dist(this.x, this.y, p.x, p.y) < this.r + p.r) { this.explode(); return; }
        }
        for (const b of blocks) {
            if (b.hp <= 0) continue;
            if (this.x > b.x - this.r && this.x < b.x + b.w + this.r &&
                this.y > b.y - this.r && this.y < b.y + b.h + this.r) { this.explode(); return; }
        }
    }
    explode() {
        if (this.exploded) return;
        this.exploded = true;
        SFX.explosion();
        state.shake = 18;
        const R = 100;
        for (let i = 0; i < 30; i++) {
            const a = rand(0, Math.PI * 2);
            const s = rand(3, 12);
            particles.push(new Particle(this.x, this.y, ['#ff6b35','#ffd93d','#fff'][randInt(0,2)], {
                vx: Math.cos(a) * s, vy: Math.sin(a) * s - 2,
                size: rand(3, 9), gravity: 0.2, decay: 0.02
            }));
        }
        pigs.forEach(p => {
            if (p.dead) return;
            const d = dist(this.x, this.y, p.x, p.y);
            if (d < R) {
                p.damage(clamp(150 * (1 - d / R), 30, 150));
                const a = Math.atan2(p.y - this.y, p.x - this.x);
                p.vx += Math.cos(a) * 10;
                p.vy += Math.sin(a) * 10 - 2;
                p.resting = false;
            }
        });
        blocks.forEach(b => {
            if (b.hp <= 0) return;
            const bx = b.x + b.w/2, by = b.y + b.h/2;
            const d = dist(this.x, this.y, bx, by);
            if (d < R) {
                b.damage(clamp(180 * (1 - d / R), 30, 180));
                b.resting = false;
            }
        });
    }
    draw() {
        if (this.exploded) return;
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.vx * 0.05);
        ctx.shadowColor = '#ff6b35';
        ctx.shadowBlur = 15;
        ctx.beginPath();
        ctx.ellipse(0, 0, this.r, this.r * 1.25, 0, 0, Math.PI * 2);
        const g = ctx.createRadialGradient(-3, -3, 2, 0, 0, this.r * 1.3);
        g.addColorStop(0, '#ffffff');
        g.addColorStop(1, '#e0e0e0');
        ctx.fillStyle = g;
        ctx.fill();
        ctx.strokeStyle = '#adb5bd';
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.shadowBlur = 0;
        ctx.beginPath();
        ctx.moveTo(-3, -8); ctx.lineTo(2, -2); ctx.lineTo(-2, 4); ctx.lineTo(3, 10);
        ctx.strokeStyle = '#ff6b35';
        ctx.lineWidth = 1.5;
        ctx.stroke();
        ctx.restore();
    }
}

/* ============================================================
   СВИНЬЯ
   ============================================================ */
class Pig {
    constructor(x, y, r = 26) {
        this.x = x; this.y = y;
        this.r = r;
        this.vx = 0; this.vy = 0;
        this.hp = 100; this.maxHp = 100;
        this.dead = false;
        this.resting = true;
        this.hurtFlash = 0;
        this.blink = 0;
        this.squish = 0;
        this.breathing = Math.random() * Math.PI * 2;
    }
    damage(amount) {
        if (this.dead) return;
        this.hp -= amount;
        this.hurtFlash = 12;
        this.squish = 1;
        if (this.hp <= 0) {
            this.dead = true;
            state.score += 100;
            addScore(100, this.x, this.y);
            SFX.pop();
            spawnBurst(this.x, this.y, '#90ee90', 22);
            spawnFeathers(this.x, this.y, 6, '#90ee90');
            state.shake = 8;
        } else {
            SFX.wood();
        }
    }
    update() {
        if (this.hurtFlash > 0) this.hurtFlash--;
        if (this.squish > 0) this.squish *= 0.85;
        if (this.blink > 0) this.blink--; else if (Math.random() < 0.01) this.blink = 10;
        this.breathing += 0.05;
        if (!this.resting && !this.dead) {
            this.vy += GRAVITY;
            this.vx *= AIR;
            this.x += this.vx;
            this.y += this.vy;
            if (this.y + this.r >= GROUND_Y) {
                this.y = GROUND_Y - this.r;
                if (Math.abs(this.vy) > 4) this.damage(Math.abs(this.vy) * 3);
                this.vy *= -0.35;
                this.vx *= 0.7;
                if (Math.abs(this.vy) < 1.2 && Math.abs(this.vx) < 0.7) {
                    this.vy = 0; this.vx = 0; this.resting = true;
                }
            }
            if (this.x - this.r < 0) { this.x = this.r; this.vx *= -0.5; }
            if (this.x + this.r > W) { this.x = W - this.r; this.vx *= -0.5; }
        }
    }
    draw() {
        if (this.dead) return;
        const R = this.r;
        const breathe = Math.sin(this.breathing) * 0.03;
        const sx = 1 + this.squish * 0.25 + breathe;
        const sy = 1 - this.squish * 0.25 - breathe;

        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.scale(sx, sy);

        ctx.beginPath();
        ctx.ellipse(0, R * 0.95, R * 0.9, R * 0.25, 0, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(0,0,0,0.2)';
        ctx.fill();

        const bodyGrad = ctx.createRadialGradient(-R*0.35, -R*0.4, R*0.1, 0, 0, R*1.15);
        if (this.hurtFlash > 0) {
            bodyGrad.addColorStop(0, '#ffb3b3');
            bodyGrad.addColorStop(0.5, '#ff6b6b');
            bodyGrad.addColorStop(1, '#b03030');
        } else {
            bodyGrad.addColorStop(0, '#c5f7ae');
            bodyGrad.addColorStop(0.5, '#79d65c');
            bodyGrad.addColorStop(1, '#3f8a2a');
        }
        ctx.beginPath();
        ctx.arc(0, 0, R, 0, Math.PI * 2);
        ctx.fillStyle = bodyGrad;
        ctx.fill();

        ctx.beginPath();
        ctx.ellipse(-R*0.35, -R*0.45, R*0.35, R*0.22, -0.5, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255,255,255,0.5)';
        ctx.fill();

        ctx.beginPath();
        ctx.arc(0, 0, R, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(30,70,20,0.8)';
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.beginPath();
        ctx.ellipse(-R*0.75, -R*0.55, R*0.22, R*0.3, -0.6, 0, Math.PI * 2);
        ctx.fillStyle = '#5cae42';
        ctx.fill();
        ctx.strokeStyle = '#3f8a2a';
        ctx.lineWidth = 1.5;
        ctx.stroke();
        ctx.beginPath();
        ctx.ellipse(R*0.75, -R*0.55, R*0.22, R*0.3, 0.6, 0, Math.PI * 2);
        ctx.fillStyle = '#5cae42';
        ctx.fill();
        ctx.stroke();

        const eyeOpen = this.blink > 0 ? 0.1 : 1;
        ctx.beginPath();
        ctx.ellipse(-R*0.3, -R*0.2, R*0.22, R*0.26 * eyeOpen, 0, 0, Math.PI * 2);
        ctx.fillStyle = 'white';
        ctx.fill();
        ctx.strokeStyle = '#2d4d1e';
        ctx.lineWidth = 1.5;
        ctx.stroke();
        ctx.beginPath();
        ctx.ellipse(R*0.3, -R*0.2, R*0.22, R*0.26 * eyeOpen, 0, 0, Math.PI * 2);
        ctx.fillStyle = 'white';
        ctx.fill();
        ctx.stroke();

        if (this.blink <= 0) {
            ctx.beginPath();
            ctx.arc(-R*0.28, -R*0.18, R*0.1, 0, Math.PI * 2);
            ctx.fillStyle = '#111';
            ctx.fill();
            ctx.beginPath();
            ctx.arc(R*0.28, -R*0.18, R*0.1, 0, Math.PI * 2);
            ctx.fillStyle = '#111';
            ctx.fill();
            ctx.beginPath();
            ctx.arc(-R*0.31, -R*0.22, R*0.04, 0, Math.PI * 2);
            ctx.fillStyle = 'white';
            ctx.fill();
            ctx.beginPath();
            ctx.arc(R*0.25, -R*0.22, R*0.04, 0, Math.PI * 2);
            ctx.fillStyle = 'white';
            ctx.fill();
        }

        ctx.beginPath();
        ctx.ellipse(0, R*0.28, R*0.42, R*0.32, 0, 0, Math.PI * 2);
        const snoutGrad = ctx.createRadialGradient(-R*0.1, R*0.2, 2, 0, R*0.28, R*0.5);
        snoutGrad.addColorStop(0, '#b8f0a0');
        snoutGrad.addColorStop(1, '#5cae42');
        ctx.fillStyle = snoutGrad;
        ctx.fill();
        ctx.strokeStyle = '#2d4d1e';
        ctx.lineWidth = 1.5;
        ctx.stroke();

        ctx.beginPath();
        ctx.ellipse(-R*0.13, R*0.28, R*0.06, R*0.09, 0, 0, Math.PI * 2);
        ctx.fillStyle = '#2d4d1e';
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(R*0.13, R*0.28, R*0.06, R*0.09, 0, 0, Math.PI * 2);
        ctx.fillStyle = '#2d4d1e';
        ctx.fill();

        ctx.restore();

        if (this.hp < this.maxHp) {
            const barW = R * 2.2, barH = 6;
            const x = this.x - barW / 2;
            const y = this.y - R - 18;
            const pct = clamp(this.hp / this.maxHp, 0, 1);
            ctx.fillStyle = 'rgba(0,0,0,0.55)';
            roundRect(x - 1, y - 1, barW + 2, barH + 2, 4);
            ctx.fill();
            const col = pct > 0.5 ? '#4cd964' : pct > 0.25 ? '#ffcc00' : '#ff3b30';
            ctx.fillStyle = col;
            roundRect(x, y, barW * pct, barH, 3);
            ctx.fill();
            ctx.fillStyle = 'rgba(255,255,255,0.3)';
            roundRect(x, y, barW * pct, barH / 2, 3);
            ctx.fill();
        }
    }
}

/* ============================================================
   БЛОКИ
   ============================================================ */
class Block {
    constructor(x, y, w, h, type = 'wood') {
        this.x = x; this.y = y;
        this.w = w; this.h = h;
        this.type = type;
        this.vx = 0; this.vy = 0;
        this.resting = true;
        this.hp = type === 'stone' ? 200 : 100;
        this.maxHp = this.hp;
        this.flash = 0;
        this.rot = 0;
        this.rotVel = 0;
        this.texSeed = (x * 7 + y * 13 + w * 3) % 100;
    }
    damage(amount) {
        this.hp -= amount;
        this.flash = 10;
        if (this.hp <= 0) {
            SFX.wood();
            spawnBurst(this.x + this.w/2, this.y + this.h/2,
                this.type === 'stone' ? '#9aa5b1' : '#c8965c', 14);
            state.score += 20;
            addScore(20, this.x + this.w/2, this.y + this.h/2);
        }
    }
    update() {
        if (this.flash > 0) this.flash--;
        if (this.hp <= 0) return;
        if (!this.resting) {
            this.vy += GRAVITY;
            this.vx *= AIR;
            this.x += this.vx;
            this.y += this.vy;
            this.rot += this.rotVel;
            if (this.y + this.h >= GROUND_Y) {
                this.y = GROUND_Y - this.h;
                this.vy *= -0.3;
                this.vx *= 0.7;
                this.rotVel *= 0.5;
                if (Math.abs(this.vy) < 1 && Math.abs(this.vx) < 0.5) {
                    this.vy = 0; this.vx = 0; this.resting = true; this.rotVel = 0;
                }
            }
            if (this.x < 0) { this.x = 0; this.vx *= -0.5; }
            if (this.x + this.w > W) { this.x = W - this.w; this.vx *= -0.5; }
        }
    }
    draw() {
        if (this.hp <= 0) return;
        ctx.save();
        ctx.translate(this.x + this.w/2, this.y + this.h/2);
        ctx.rotate(this.rot);
        const x = -this.w/2, y = -this.h/2;

        ctx.shadowColor = 'rgba(0,0,0,0.3)';
        ctx.shadowBlur = 10;
        ctx.shadowOffsetY = 4;

        let grad;
        if (this.type === 'stone') {
            grad = ctx.createLinearGradient(x, y, x + this.w, y + this.h);
            if (this.flash > 0) { grad.addColorStop(0, '#ffcccc'); grad.addColorStop(1, '#cc8888'); }
            else { grad.addColorStop(0, '#c5cdd6'); grad.addColorStop(0.5, '#7d8896'); grad.addColorStop(1, '#4d5762'); }
        } else {
            grad = ctx.createLinearGradient(x, y, x, y + this.h);
            if (this.flash > 0) { grad.addColorStop(0, '#ffb3b3'); grad.addColorStop(1, '#cc6666'); }
            else { grad.addColorStop(0, '#e0b078'); grad.addColorStop(0.4, '#c8965c'); grad.addColorStop(1, '#8a5c2c'); }
        }
        ctx.fillStyle = grad;
        ctx.fillRect(x, y, this.w, this.h);

        ctx.shadowColor = 'transparent';
        ctx.shadowBlur = 0;
        ctx.shadowOffsetY = 0;

        if (this.type === 'wood') {
            ctx.strokeStyle = 'rgba(80,40,10,0.35)';
            ctx.lineWidth = 1;
            const isVert = this.h > this.w;
            const count = Math.max(2, Math.floor(isVert ? this.w / 8 : this.h / 8));
            for (let i = 1; i < count; i++) {
                ctx.beginPath();
                if (isVert) {
                    const px = x + i * (this.w / count);
                    ctx.moveTo(px, y); ctx.lineTo(px, y + this.h);
                } else {
                    const py = y + i * (this.h / count);
                    ctx.moveTo(x, py); ctx.lineTo(x + this.w, py);
                }
                ctx.stroke();
            }
        } else {
            ctx.strokeStyle = 'rgba(40,50,60,0.4)';
            ctx.lineWidth = 1;
            for (let i = 0; i < 3; i++) {
                const sx = x + ((this.texSeed + i * 37) % 100) / 100 * this.w;
                const sy = y + ((this.texSeed + i * 53) % 100) / 100 * this.h;
                ctx.beginPath();
                ctx.moveTo(sx, sy);
                ctx.lineTo(sx + 8, sy + 10);
                ctx.lineTo(sx + 3, sy + 18);
                ctx.stroke();
            }
        }

        ctx.strokeStyle = this.type === 'stone' ? '#2d3742' : '#5a3a1a';
        ctx.lineWidth = 2;
        ctx.strokeRect(x, y, this.w, this.h);

        const blik = ctx.createLinearGradient(x, y, x, y + this.h * 0.35);
        blik.addColorStop(0, 'rgba(255,255,255,0.35)');
        blik.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = blik;
        ctx.fillRect(x, y, this.w, this.h * 0.35);

        ctx.restore();

        if (this.hp < this.maxHp) {
            const pct = this.hp / this.maxHp;
            ctx.fillStyle = 'rgba(0,0,0,0.55)';
            ctx.fillRect(this.x - 1, this.y - 8, this.w + 2, 5);
            ctx.fillStyle = pct > 0.5 ? '#4cd964' : pct > 0.25 ? '#ffcc00' : '#ff3b30';
            ctx.fillRect(this.x, this.y - 7, this.w * pct, 3);
        }
    }
}

/* ============================================================
   ЧАСТИЦЫ
   ============================================================ */
class Particle {
    constructor(x, y, color, opts = {}) {
        this.x = x; this.y = y;
        this.vx = opts.vx ?? rand(-5, 5);
        this.vy = opts.vy ?? rand(-8, -1);
        this.size = opts.size ?? rand(3, 7);
        this.color = color;
        this.life = 1;
        this.decay = opts.decay ?? rand(0.012, 0.025);
        this.gravity = opts.gravity ?? 0.3;
        this.shape = opts.shape ?? 'circle';
        this.rot = rand(0, Math.PI * 2);
        this.rotVel = rand(-0.2, 0.2);
    }
    update() {
        this.x += this.vx; this.y += this.vy;
        this.vy += this.gravity;
        this.vx *= 0.98;
        this.life -= this.decay;
        this.rot += this.rotVel;
    }
    draw() {
        ctx.save();
        ctx.globalAlpha = Math.max(0, this.life);
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rot);
        ctx.fillStyle = this.color;
        if (this.shape === 'circle') {
            ctx.beginPath();
            ctx.arc(0, 0, this.size, 0, Math.PI * 2);
            ctx.fill();
        } else if (this.shape === 'feather') {
            ctx.beginPath();
            ctx.ellipse(0, 0, this.size * 1.4, this.size * 0.5, 0, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.restore();
    }
}

class FloatingText {
    constructor(x, y, text, color = '#fff') {
        this.x = x; this.y = y;
        this.text = text; this.color = color;
        this.life = 1; this.vy = -1.5;
    }
    update() { this.y += this.vy; this.vy *= 0.96; this.life -= 0.02; }
    draw() {
        ctx.save();
        ctx.globalAlpha = Math.max(0, this.life);
        ctx.font = 'bold 22px "Segoe UI", sans-serif';
        ctx.textAlign = 'center';
        ctx.lineWidth = 4;
        ctx.strokeStyle = 'rgba(0,0,0,0.6)';
        ctx.strokeText(this.text, this.x, this.y);
        ctx.fillStyle = this.color;
        ctx.fillText(this.text, this.x, this.y);
        ctx.restore();
    }
}

function spawnBurst(x, y, color, count = 12) {
    for (let i = 0; i < count; i++) {
        particles.push(new Particle(x, y, color, {
            vx: rand(-7, 7), vy: rand(-9, 0),
            size: rand(3, 8), gravity: 0.35
        }));
    }
}
function spawnDust(x, y, count = 8) {
    for (let i = 0; i < count; i++) {
        particles.push(new Particle(x + rand(-15, 15), y, 'rgba(200,180,150,0.8)', {
            vx: rand(-3, 3), vy: rand(-4, -0.5),
            size: rand(4, 10), gravity: 0.1, decay: rand(0.02, 0.04)
        }));

}
function spawnFeathers(x, y, count = 5, color = null) {
    for (let i = 0; i < count; i++) {
        feathers.push(new Particle(x, y, color || ['#ff6b6b', '#ffd93d', '#ffffff'][randInt(0,2)], {
            vx: rand(-4, 4), vy: rand(-6, -1),

}
function addScore(amount, x, y) {
    floatingTexts.push(new FloatingText(x, y, '+' + amount, '#ffe066'));

}
