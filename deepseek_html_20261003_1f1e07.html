   ФОН
   ============================================================ */
function initBackground() {
    clouds = [];
    for (let i = 0; i < 8; i++) {
        clouds.push({
            x: rand(0, W), y: rand(40, 220),
            scale: rand(0.5, 1.4), speed: rand(0.05, 0.18),
            alpha: rand(0.35, 0.85)
        });
    }
    stars = [];
    for (let i = 0; i < 40; i++) {
        stars.push({
            x: rand(0, W), y: rand(0, 220),
            r: rand(0.5, 1.6), twinkle: rand(0, Math.PI * 2),
            speed: rand(0.02, 0.06)
        });
    }
}

function drawSky() {
    const skyGrad = ctx.createLinearGradient(0, 0, 0, GROUND_Y + 50);
    skyGrad.addColorStop(0, '#1a2151');
    skyGrad.addColorStop(0.3, '#3d4d8c');
    skyGrad.addColorStop(0.55, '#7a6bb0');
    skyGrad.addColorStop(0.78, '#e8896b');
    skyGrad.addColorStop(1, '#ffd89b');
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0, 0, W, GROUND_Y + 50);

    stars.forEach(s => {
        s.twinkle += s.speed;
        const a = 0.4 + Math.sin(s.twinkle) * 0.4;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255,255,255,${a})`;
        ctx.fill();
    });

    ctx.save();
    ctx.shadowColor = 'rgba(255,240,200,0.9)';
    ctx.shadowBlur = 40;
    ctx.beginPath();
    ctx.arc(830, 100, 42, 0, Math.PI * 2);
    const moonGrad = ctx.createRadialGradient(820, 90, 5, 830, 100, 45);
    moonGrad.addColorStop(0, '#fffbe8');
    moonGrad.addColorStop(0.7, '#ffeeb5');
    moonGrad.addColorStop(1, '#f5d98a');
    ctx.fillStyle = moonGrad;
    ctx.fill();
    ctx.restore();

    ctx.fillStyle = 'rgba(60,50,110,0.55)';
    ctx.beginPath();
    ctx.moveTo(0, GROUND_Y - 20);
    for (let x = 0; x <= W; x += 50) {
        const h = 60 + Math.sin(x * 0.008) * 30 + Math.sin(x * 0.021) * 20;
        ctx.lineTo(x, GROUND_Y - 30 - h);
    }
    ctx.lineTo(W, GROUND_Y);
    ctx.lineTo(0, GROUND_Y);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = 'rgba(40,30,80,0.75)';
    ctx.beginPath();
    ctx.moveTo(0, GROUND_Y);
    for (let x = 0; x <= W; x += 40) {
        const h = 30 + Math.sin(x * 0.012 + 1) * 20 + Math.cos(x * 0.03) * 15;
        ctx.lineTo(x, GROUND_Y - h);
    }
    ctx.lineTo(W, GROUND_Y);
    ctx.closePath();
    ctx.fill();

    clouds.forEach(c => {
        c.x += c.speed;
        if (c.x > W + 120 * c.scale) c.x = -120 * c.scale;
        drawCloud(c.x, c.y, c.scale, c.alpha);
    });
}

function drawCloud(x, y, scale, alpha) {
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = 'rgba(255, 245, 235, 0.85)';
    ctx.shadowColor = 'rgba(255,200,150,0.4)';
    ctx.shadowBlur = 25;
    ctx.beginPath();
    ctx.arc(x, y, 28 * scale, 0, Math.PI * 2);
    ctx.arc(x + 30 * scale, y - 8 * scale, 34 * scale, 0, Math.PI * 2);
    ctx.arc(x + 65 * scale, y, 26 * scale, 0, Math.PI * 2);
    ctx.arc(x + 35 * scale, y + 12 * scale, 30 * scale, 0, Math.PI * 2);
    ctx.arc(x + 5 * scale, y + 10 * scale, 22 * scale, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
}

function drawGround() {
    const grad = ctx.createLinearGradient(0, GROUND_Y, 0, H);
    grad.addColorStop(0, '#7bc043');
    grad.addColorStop(0.12, '#5ea632');
    grad.addColorStop(0.5, '#3f7a22');
    grad.addColorStop(1, '#2a4d14');
    ctx.fillStyle = grad;
    ctx.fillRect(0, GROUND_Y, W, H - GROUND_Y);

    ctx.fillStyle = 'rgba(180, 240, 130, 0.7)';
    ctx.fillRect(0, GROUND_Y, W, 4);

    ctx.strokeStyle = 'rgba(140, 210, 90, 0.8)';
    ctx.lineWidth = 2;
    ctx.lineCap = 'round';
    for (let i = 0; i < W; i += 12) {
        const h = 6 + Math.sin(i * 0.3 + state.time * 0.02) * 3;
        ctx.beginPath();
        ctx.moveTo(i, GROUND_Y + 2);
        ctx.quadraticCurveTo(i + 3, GROUND_Y - h, i + 7, GROUND_Y + 2);
        ctx.stroke();
    }

    ctx.fillStyle = 'rgba(60,40,20,0.35)';
    for (let i = 0; i < 20; i++) {
        const x = (i * 137) % W;
        const y = GROUND_Y + 18 + (i * 23) % 40;
        ctx.beginPath();
        ctx.ellipse(x, y, 4 + (i % 3), 2 + (i % 2), 0, 0, Math.PI * 2);
        ctx.fill();
    }
}

function drawSlingshotBack() {
    ctx.save();
    ctx.lineCap = 'round';
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath();
    ctx.ellipse(slingshot.x, GROUND_Y + 6, 55, 10, 0, 0, Math.PI * 2);
    ctx.fill();

    const grad = ctx.createLinearGradient(slingshot.x, slingshot.y, slingshot.x + 40, GROUND_Y);
    grad.addColorStop(0, '#7a4a1e');
    grad.addColorStop(1, '#4a2c10');
    ctx.strokeStyle = grad;
    ctx.lineWidth = 14;
    ctx.beginPath();
    ctx.moveTo(slingshot.x + 30, GROUND_Y);
    ctx.quadraticCurveTo(slingshot.x + 32, GROUND_Y - 60, slingshot.forkRight.x, slingshot.forkRight.y);
    ctx.stroke();
    ctx.strokeStyle = 'rgba(30,15,5,0.6)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(slingshot.x + 30, GROUND_Y);
    ctx.quadraticCurveTo(slingshot.x + 32, GROUND_Y - 60, slingshot.forkRight.x, slingshot.forkRight.y);
    ctx.stroke();
    ctx.restore();
}

function drawSlingshotFront() {
    ctx.save();
    ctx.lineCap = 'round';

    const grad = ctx.createLinearGradient(slingshot.x, slingshot.y, slingshot.x - 40, GROUND_Y);
    grad.addColorStop(0, '#9c5f26');
    grad.addColorStop(1, '#5c3814');
    ctx.strokeStyle = grad;
    ctx.lineWidth = 16;
    ctx.beginPath();
    ctx.moveTo(slingshot.x - 30, GROUND_Y);
    ctx.quadraticCurveTo(slingshot.x - 32, GROUND_Y - 60, slingshot.forkLeft.x, slingshot.forkLeft.y);
    ctx.stroke();

    ctx.strokeStyle = 'rgba(40,20,5,0.5)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(slingshot.x - 30, GROUND_Y);
    ctx.quadraticCurveTo(slingshot.x - 32, GROUND_Y - 60, slingshot.forkLeft.x, slingshot.forkLeft.y);
    ctx.stroke();

    ctx.strokeStyle = 'rgba(255,200,140,0.35)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(slingshot.x - 34, GROUND_Y);
    ctx.quadraticCurveTo(slingshot.x - 36, GROUND_Y - 60, slingshot.forkLeft.x - 2, slingshot.forkLeft.y + 10);
    ctx.stroke();

    const anchorL = slingshot.forkLeft;
    const anchorR = slingshot.forkRight;
    let birdX = bird ? bird.x : slingshot.x;
    let birdY = bird ? bird.y : slingshot.y;

    ctx.strokeStyle = '#3a2410';
    ctx.lineWidth = 6;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(anchorR.x, anchorR.y);
    ctx.lineTo(birdX + 3, birdY + 3);
    ctx.stroke();

    ctx.strokeStyle = '#5a3818';
    ctx.lineWidth = 6;
    ctx.beginPath();
    ctx.moveTo(anchorL.x, anchorL.y);
    ctx.lineTo(birdX - 3, birdY - 3);
    ctx.stroke();

    if (!bird || !bird.launched) {
        ctx.beginPath();
        ctx.ellipse(birdX, birdY + 8, 12, 8, 0, 0, Math.PI * 2);
        ctx.fillStyle = '#3a2410';
        ctx.fill();
        ctx.strokeStyle = '#1a0f05';
        ctx.lineWidth = 1.5;
        ctx.stroke();
    }
    ctx.restore();
}

function drawTrajectory() {
    if (!state.dragging || state.phase !== 'aiming' || !bird) return;
    const dx = slingshot.x - bird.x;
    const dy = slingshot.y - bird.y;
    const power = Math.min(Math.hypot(dx, dy), MAX_PULL);
    const angle = Math.atan2(dy, dx);
    const vx = Math.cos(angle) * power * LAUNCH_MULT;
    const vy = Math.sin(angle) * power * LAUNCH_MULT;

    let sx = slingshot.x, sy = slingshot.y;
    let svx = vx, svy = vy;

    ctx.save();
    ctx.setLineDash([6, 12]);
    ctx.strokeStyle = 'rgba(255,255,255,0.55)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(sx, sy);
    for (let i = 0; i < 80; i++) {
        svy += GRAVITY; sx += svx; sy += svy;
        if (sy > GROUND_Y || sx > W || sx < 0) break;
        ctx.lineTo(sx, sy);
    }
    ctx.stroke();
    ctx.restore();

    sx = slingshot.x; sy = slingshot.y; svx = vx; svy = vy;
    for (let i = 0; i < 80; i++) {
        svy += GRAVITY; sx += svx; sy += svy;
        if (sy > GROUND_Y || sx > W || sx < 0) break;
        if (i % 5 === 0) {
            const t = i / 80;
            const alpha = 0.9 * (1 - t * 0.7);
            const r = 3.5 * (1 - t * 0.4);
            ctx.beginPath();
            ctx.arc(sx, sy, r, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(255, 220, 100, ${alpha})`;
            ctx.shadowColor = 'rgba(255,180,50,0.9)';
            ctx.shadowBlur = 8;
            ctx.fill();
        }
    }
    ctx.shadowBlur = 0;

    const pct = power / MAX_PULL;
    const barW = 220, barH = 16;
    const bx = slingshot.x - barW / 2;
    const by = GROUND_Y + 30;
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    roundRect(bx - 3, by - 3, barW + 6, barH + 6, 10);
    ctx.fill();
    const powerGrad = ctx.createLinearGradient(bx, 0, bx + barW, 0);
    powerGrad.addColorStop(0, '#4cd964');
    powerGrad.addColorStop(0.5, '#ffcc00');
    powerGrad.addColorStop(1, '#ff3b30');
    ctx.fillStyle = powerGrad;
    roundRect(bx, by, barW * pct, barH, 8);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    roundRect(bx, by, barW * pct, barH / 2, 8);
    ctx.fill();
    ctx.fillStyle = 'white';
    ctx.font = 'bold 12px "Segoe UI"';
    ctx.textAlign = 'center';
    ctx.fillText(Math.round(pct * 100) + '%', bx + barW / 2, by + barH - 3);
}

function roundRect(x, y, w, h, r) {
    if (w < 2 * r) r = w / 2;
    if (h < 2 * r) r = h / 2;
    if (r < 0) r = 0;
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
}

/* ============================================================
   ФИЗИКА
   ============================================================ */
function circleCircle(a, b) {
    const dx = a.x - b.x, dy = a.y - b.y;
    const r = a.r + b.r;
    return dx * dx + dy * dy < r * r;
}
function circleRect(circle, block) {
    const cx = clamp(circle.x, block.x, block.x + block.w);
    const cy = clamp(circle.y, block.y, block.y + block.h);
    const dx = circle.x - cx, dy = circle.y - cy;
    return dx * dx + dy * dy < circle.r * circle.r;
}
function resolveCircleRect(circle, block) {
    const cx = clamp(circle.x, block.x, block.x + block.w);
    const cy = clamp(circle.y, block.y, block.y + block.h);
    let dx = circle.x - cx, dy = circle.y - cy;
    let d = Math.hypot(dx, dy);
    if (d === 0) {
        const left = circle.x - block.x;
        const right = block.x + block.w - circle.x;
        const top = circle.y - block.y;
        const bottom = block.y + block.h - circle.y;
        const m = Math.min(left, right, top, bottom);
        if (m === left)      { dx = -1; dy = 0; d = 1; }
        else if (m === right){ dx = 1; dy = 0; d = 1; }
        else if (m === top)  { dx = 0; dy = -1; d = 1; }
        else                 { dx = 0; dy = 1; d = 1; }
    }
    const nx = dx / d, ny = dy / d;
    const overlap = circle.r - d;
    circle.x += nx * overlap;
    circle.y += ny * overlap;
    const dot = circle.vx * nx + circle.vy * ny;
    if (dot < 0) {
        circle.vx -= 1.6 * dot * nx;
        circle.vy -= 1.6 * dot * ny;
        circle.vx *= 0.85;
        circle.vy *= 0.85;
    }
}

function updatePhysics() {
    state.time++;
    birds.forEach(b => b.update());
    pigs.forEach(p => p.update());
    blocks.forEach(b => b.update());
    eggs.forEach(e => e.update());
    eggs = eggs.filter(e => !e.exploded);

    particles = particles.filter(p => p.life > 0);
    particles.forEach(p => p.update());
    feathers = feathers.filter(p => p.life > 0);
    feathers.forEach(p => p.update());
    floatingTexts = floatingTexts.filter(t => t.life > 0);
    floatingTexts.forEach(t => t.update());

    if (state.shake > 0) {
        state.shake *= 0.85;
        state.shakeX = rand(-state.shake, state.shake);
        state.shakeY = rand(-state.shake, state.shake);
        if (state.shake < 0.3) state.shake = 0;
    } else { state.shakeX = 0; state.shakeY = 0; }

    birds.forEach(b => {
        if (!b.launched || b.resting) return;
        const speed = Math.hypot(b.vx, b.vy);

        pigs.forEach(pig => {
            if (pig.dead || b.hitCooldown > 0) return;
            if (circleCircle(b, pig)) {
                const dmg = clamp(speed * 14, 20, 160);
                pig.damage(dmg);
                pig.vx = b.vx * 0.6;
                pig.vy = b.vy * 0.5 - 2;
                pig.resting = false;
                const dx = b.x - pig.x;
                const dy = b.y - pig.y;
                const d = Math.hypot(dx, dy) || 1;
                b.vx = (dx / d) * speed * 0.55;
                b.vy = (dy / d) * speed * 0.55 - 1;
                b.hitCooldown = 6;
                SFX.hit();
                state.shake = 9;
                spawnBurst(pig.x, pig.y, '#ffd93d', 8);
            }
        });

        blocks.forEach(block => {
            if (block.hp <= 0 || b.hitCooldown > 0) return;
            if (circleRect(b, block)) {
                if (speed > 4) block.damage(clamp(speed * 7, 15, 130));
                resolveCircleRect(b, block);
                block.vx += b.vx * 0.25;
                block.vy += b.vy * 0.2;
                if (Math.abs(block.vx) > 1 || Math.abs(block.vy) > 1) block.resting = false;
                b.hitCooldown = 4;
                state.shake = Math.min(10, speed * 0.7);
                if (speed > 3) SFX.hit();
            }
        });
    });

    pigs.forEach(pig => {
        if (pig.dead) return;
        blocks.forEach(block => {
            if (block.hp <= 0) return;
            if (circleRect(pig, block)) {
                resolveCircleRect(pig, block);
                if (Math.hypot(pig.vx, pig.vy) > 4) {
                    pig.damage(Math.hypot(pig.vx, pig.vy) * 4);
                }
                pig.resting = false;
            }
        });
    });

    for (let i = 0; i < pigs.length; i++) {
        for (let j = i + 1; j < pigs.length; j++) {
            const a = pigs[i], b = pigs[j];
            if (a.dead || b.dead) continue;
            if (circleCircle(a, b)) {
                const dx = b.x - a.x, dy = b.y - a.y;
                const d = Math.hypot(dx, dy) || 1;
                const overlap = (a.r + b.r) - d;
                const nx = dx / d, ny = dy / d;
                a.x -= nx * overlap / 2; a.y -= ny * overlap / 2;
                b.x += nx * overlap / 2; b.y += ny * overlap / 2;
                const dvx = b.vx - a.vx, dvy = b.vy - a.vy;
                const impulse = dvx * nx + dvy * ny;
                if (impulse < 0) {
                    a.vx += impulse * nx * 0.5; a.vy += impulse * ny * 0.5;
                    b.vx -= impulse * nx * 0.5; b.vy -= impulse * ny * 0.5;
                }
                if (overlap > 1) { a.resting = false; b.resting = false; }
            }
        }
    }

    if (state.phase === 'flying') {
        const anyFlying = birds.some(b => b.launched && !b.resting && b.y < H + 100);
        if (!anyFlying && state.time - state.launchTime > 30) {
            endShot();
        }
    }
}

/* ============================================================
   ЛОГИКА ИГРЫ
   ============================================================ */
let currentBirdQueue = [];
let currentLevelIdx = 0;

function loadLevel(idx) {
    const level = LEVELS[idx];
    currentLevelIdx = idx;
    state.currentLevel = idx;
    state.score = 0;
    state.phase = 'idle';
    state.dragging = false;
    state.shake = 0;
    state.time = 0;
    state.launchTime = 0;

    birds = [];
    pigs = [];
    blocks = [];
    eggs = [];
    particles = [];
    feathers = [];
    floatingTexts = [];
    bird = null;

    lastAbilityTime = 0;

    currentBirdQueue = [...level.birds];
    spawnNextBird();

    level.pigs.forEach(p => pigs.push(new Pig(p.x, p.y, p.r)));
    level.blocks.forEach(b => blocks.push(new Block(b.x, b.y, b.w, b.h, b.type)));

    updateHUD();
    hideOverlay();
    levelNumEl.textContent = idx + 1;
    hint.style.opacity = '1';
    setTimeout(() => { hint.style.opacity = '0.6'; }, 4000);
}

function spawnNextBird() {
    if (currentBirdQueue.length === 0) {
        bird = null;
        return false;
    }
    const typeKey = currentBirdQueue.shift();
    bird = new Bird(slingshot.x, slingshot.y, typeKey);
    birds.push(bird);
    state.phase = 'idle';
    updateHUD();
    updateAbilityIndicator();
    return true;
}

function updateAbilityIndicator() {
    const flyingBird = birds.find(b =>
        b.launched && !b.resting && !b.abilityUsed && b.type.ability && b.y < H
    );
    if (flyingBird) {
        abilityIcon.textContent = flyingBird.type.icon;
        abilityText.textContent = flyingBird.type.abilityName + ' — Клик!';
        abilityIndicator.classList.add('show');
    } else {
        abilityIndicator.classList.remove('show');
    }
}

function updateHUD() {
    scoreEl.textContent = state.score;
}

function endShot() {
    if (state.phase !== 'flying') return;

    const anyFlying = birds.some(b => b.launched && !b.resting && b.y < H + 100);
    if (anyFlying) return;

    state.phase = 'settling';

    const alivePigs = pigs.filter(p => !p.dead).length;

    if (alivePigs === 0) {
        setTimeout(() => {
            if (state.phase !== 'settling') return;
            state.phase = 'over';
            showVictory();
        }, 600);
        return;
    }

    if (currentBirdQueue.length === 0) {
        setTimeout(() => {
            if (state.phase !== 'settling') return;
            state.phase = 'over';
            showDefeat();
        }, 600);
        return;
    }

    setTimeout(() => {
        if (state.phase !== 'settling') return;
        birds = birds.filter(b => b.launched && !b.resting);
        bird = null;
        spawnNextBird();
    }, 700);
}

function showVictory() {
    const level = LEVELS[currentLevelIdx];
    let stars = 1;
    if (state.score >= level.stars[2]) stars = 3;
    else if (state.score >= level.stars[1]) stars = 2;

    if (!bestScores[currentLevelIdx] || state.score > bestScores[currentLevelIdx].score) {
        bestScores[currentLevelIdx] = { score: state.score, stars };
    }

    overlayTitle.textContent = 'Победа!';
    overlayScore.textContent = state.score;
    overlayStars.textContent = '⭐'.repeat(stars) + '☆'.repeat(3 - stars);
    nextLevelBtn.style.display = (currentLevelIdx < LEVELS.length - 1) ? 'flex' : 'none';
    overlay.classList.add('show');
    SFX.win();
    buildLevelsGrid();
}

function showDefeat() {
    overlayTitle.textContent = 'Провал...';
    overlayScore.textContent = state.score;
    overlayStars.textContent = '☆☆☆';
    nextLevelBtn.style.display = 'none';
    overlay.classList.add('show');
    SFX.lose();
}

function hideOverlay() { overlay.classList.remove('show'); }

/* ============================================================
   ВВОД
   ============================================================ */
function getMouse(e) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = W / rect.width;
    const scaleY = H / rect.height;
    let cx, cy;
    if (e.touches && e.touches.length > 0) {
        cx = e.touches[0].clientX;
        cy = e.touches[0].clientY;
    } else if (e.changedTouches && e.changedTouches.length > 0) {
        cx = e.changedTouches[0].clientX;
        cy = e.changedTouches[0].clientY;
    } else {
        cx = e.clientX;
        cy = e.clientY;
    }
    return {
        x: (cx - rect.left) * scaleX,
        y: (cy - rect.top) * scaleY
    };
}

function onDown(e) {
    ensureAudio();
    if (state.phase === 'over' || state.phase === 'menu') return;

    const m = getMouse(e);
    const now = performance.now();

    if (state.phase === 'flying') {
        const flyingBird = birds.find(b =>
            b.launched && !b.resting && !b.abilityUsed && b.type.ability && b.y < H
        );
        if (flyingBird && now - lastAbilityTime > 300) {
            lastAbilityTime = now;
            if (flyingBird.activateAbility()) {
                updateAbilityIndicator();
                return;
            }
        }
        return;
    }

    if (state.phase !== 'idle') return;
    if (!bird || bird.launched) return;

    const dBird = dist(m.x, m.y, bird.x, bird.y);
    const dSling = dist(m.x, m.y, slingshot.x, slingshot.y);

    if (dBird < 70 || dSling < 70) {
        state.dragging = true;
        state.phase = 'aiming';
        SFX.pull();
    }
}

function onMove(e) {
    if (!state.dragging || !bird) return;
    e.preventDefault();

    const m = getMouse(e);
    let dx = m.x - slingshot.x;
    let dy = m.y - slingshot.y;

    if (dx > 0) dx = 0;

    const d = Math.hypot(dx, dy);
    if (d > MAX_PULL) {
        dx = dx / d * MAX_PULL;
        dy = dy / d * MAX_PULL;
    }

    bird.x = slingshot.x + dx;
    bird.y = slingshot.y + dy;
    bird.angle = Math.atan2(-dy, -dx);
}

function onUp(e) {
    if (!state.dragging || !bird) return;
    state.dragging = false;

    const dx = slingshot.x - bird.x;
    const dy = slingshot.y - bird.y;
    const power = Math.hypot(dx, dy);

    if (power < 18) {
        bird.x = slingshot.x;
        bird.y = slingshot.y;
        bird.angle = 0;
        state.phase = 'idle';
        return;
    }

    const angle = Math.atan2(dy, dx);
    const vx = Math.cos(angle) * power * LAUNCH_MULT;
    const vy = Math.sin(angle) * power * LAUNCH_MULT;

    bird.launch(vx, vy);
    bird.angle = Math.atan2(vy, vx);
    state.phase = 'flying';
    state.launchTime = state.time;
    hint.style.opacity = '0';
    updateAbilityIndicator();
}

canvas.addEventListener('mousedown', onDown);
canvas.addEventListener('mousemove', onMove);
canvas.addEventListener('mouseup', onUp);
canvas.addEventListener('mouseleave', () => {
    if (state.dragging && bird) {
        // Принудительно выпускаем птицу, если мышь ушла
        onUp({ clientX: 0, clientY: 0 });
    }
});

canvas.addEventListener('touchstart', (e) => {
    e.preventDefault();
    onDown(e);
}, { passive: false });

canvas.addEventListener('touchmove', (e) => {
    e.preventDefault();
    onMove(e);
}, { passive: false });

canvas.addEventListener('touchend', (e) => {
    e.preventDefault();
    onUp(e);
}, { passive: false });

canvas.addEventListener('touchcancel', (e) => {
    e.preventDefault();
    onUp(e);
}, { passive: false });

/* ============================================================
   UI
   ============================================================ */
playBtn.addEventListener('click', () => {
    ensureAudio();
    menuScreen.classList.remove('show');
    levelsScreen.classList.remove('show');
    showGameUI();
    loadLevel(0);
});
levelsBtn.addEventListener('click', () => {
    ensureAudio();
    menuScreen.classList.remove('show');
    buildLevelsGrid();
    levelsScreen.classList.add('show');
});
backBtn.addEventListener('click', () => {
    levelsScreen.classList.remove('show');
    menuScreen.classList.add('show');
});
menuSoundBtn.addEventListener('click', () => {
    soundEnabled = !soundEnabled;
    menuSoundBtn.textContent = soundEnabled ? '🔊 Звук: Вкл' : '🔇 Звук: Выкл';
    soundBtn.textContent = soundEnabled ? '🔊' : '🔇';
    if (soundEnabled) { ensureAudio(); beep(600, 0.1, 'sine', 0.1); }
});
soundBtn.addEventListener('click', () => {
    soundEnabled = !soundEnabled;
    soundBtn.textContent = soundEnabled ? '🔊' : '🔇';
    menuSoundBtn.textContent = soundEnabled ? '🔊 Звук: Вкл' : '🔇 Звук: Выкл';
    if (soundEnabled) { ensureAudio(); beep(600, 0.1, 'sine', 0.1); }
});
restartBtn.addEventListener('click', () => { ensureAudio(); loadLevel(currentLevelIdx); });
playAgainBtn.addEventListener('click', () => { ensureAudio(); loadLevel(currentLevelIdx); });
nextLevelBtn.addEventListener('click', () => {
    ensureAudio();
    if (currentLevelIdx < LEVELS.length - 1) loadLevel(currentLevelIdx + 1);
});
menuBtn.addEventListener('click', () => {
    hideGameUI();
    overlay.classList.remove('show');
    menuScreen.classList.add('show');
    state.phase = 'menu';
});
overlayMenuBtn.addEventListener('click', () => {
    overlay.classList.remove('show');
    hideGameUI();
    menuScreen.classList.add('show');
    state.phase = 'menu';
});

function showGameUI() {
    hud.style.display = 'flex';
    controls.style.display = 'flex';
    hint.style.display = 'block';
}
function hideGameUI() {
    hud.style.display = 'none';
    controls.style.display = 'none';
    hint.style.display = 'none';
    abilityIndicator.classList.remove('show');
}

function buildLevelsGrid() {
    levelsGrid.innerHTML = '';
    LEVELS.forEach((level, idx) => {
        const unlocked = idx === 0 || bestScores[idx - 1];
        const best = bestScores[idx];

        const card = document.createElement('div');
        card.className = 'level-card' + (unlocked ? '' : ' locked');

        const num = document.createElement('div');
        num.className = 'level-num';
        num.textContent = '#' + (idx + 1);
        card.appendChild(num);

        const name = document.createElement('div');
        name.className = 'level-name';
        name.textContent = level.name;
        card.appendChild(name);

        const birdsDiv = document.createElement('div');
        birdsDiv.className = 'level-birds';
        level.birds.forEach(typeKey => {
            const icon = document.createElement('div');
            icon.className = 'bird-icon ' + typeKey;
            birdsDiv.appendChild(icon);
        });
        card.appendChild(birdsDiv);

        const stars = document.createElement('div');
        stars.className = 'level-stars';
        stars.textContent = best ? '⭐'.repeat(best.stars) + '☆'.repeat(3 - best.stars) : '☆☆☆';
        card.appendChild(stars);

        if (!unlocked) {
            const lock = document.createElement('div');
            lock.className = 'level-lock';
            lock.textContent = '🔒';
            card.appendChild(lock);
        } else {
            card.addEventListener('click', () => {
                ensureAudio();
                levelsScreen.classList.remove('show');
                showGameUI();
                loadLevel(idx);
            });
        }
        levelsGrid.appendChild(card);
    });
}

/* ============================================================
   ОТРИСОВКА
   ============================================================ */
function draw() {
    ctx.save();
    ctx.translate(state.shakeX, state.shakeY);

    drawSky();
    drawGround();
    drawSlingshotBack();

    blocks.forEach(b => b.draw());
    pigs.forEach(p => p.draw());
    eggs.forEach(e => e.draw());

    birds.filter(b => !b.isChild).forEach(b => b.draw());
    birds.filter(b => b.isChild).forEach(b => b.draw());

    particles.forEach(p => p.draw());
    feathers.forEach(p => p.draw());

    drawSlingshotFront();
    drawTrajectory();
    floatingTexts.forEach(t => t.draw());

    if (state.phase !== 'menu') drawBirdQueue();
    ctx.restore();
}

function drawBirdQueue() {
    const startX = 55;
    const y = GROUND_Y + 40;
    for (let i = 0; i < currentBirdQueue.length; i++) {
        const typeKey = currentBirdQueue[i];
        const t = BIRD_TYPES[typeKey];
        const x = startX + i * 46;

        ctx.save();
        ctx.translate(x, y);
        ctx.scale(0.7, 0.7);

        const g = ctx.createRadialGradient(-8, -8, 2, 0, 0, 22);
        g.addColorStop(0, t.color1);
        g.addColorStop(1, t.color3);

        if (typeKey === 'yellow') {
            ctx.beginPath();
            ctx.moveTo(22, 0);
            ctx.lineTo(-18, -20);
            ctx.lineTo(-18, 20);
            ctx.closePath();
            ctx.fillStyle = g;
            ctx.fill();
            ctx.strokeStyle = 'rgba(120,80,0,0.8)';
            ctx.lineWidth = 2;
            ctx.lineJoin = 'round';
            ctx.stroke();
        } else {
            ctx.beginPath();
            ctx.arc(0, 0, 20, 0, Math.PI * 2);
            ctx.fillStyle = g;
            ctx.fill();
            ctx.strokeStyle = 'rgba(0,0,0,0.6)';
            ctx.lineWidth = 2;
            ctx.stroke();
        }

        ctx.beginPath();
        ctx.arc(-5, -5, 5, 0, Math.PI * 2);
        ctx.fillStyle = 'white';
        ctx.fill();
        ctx.beginPath();
        ctx.arc(5, -5, 5, 0, Math.PI * 2);
        ctx.fillStyle = 'white';
        ctx.fill();
        ctx.beginPath();
        ctx.arc(-5, -5, 2.5, 0, Math.PI * 2);
        ctx.fillStyle = 'black';
        ctx.fill();
        ctx.beginPath();
        ctx.arc(5, -5, 2.5, 0, Math.PI * 2);
        ctx.fillStyle = 'black';
        ctx.fill();

        ctx.beginPath();
        ctx.moveTo(-12, -12);
        ctx.lineTo(2, -16);
        ctx.strokeStyle = 'rgba(0,0,0,0.85)';
        ctx.lineWidth = 3;
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(8, 0);
        ctx.lineTo(22, 4);
        ctx.lineTo(8, 10);
        ctx.closePath();
        ctx.fillStyle = '#ffd93d';
        ctx.fill();
        ctx.strokeStyle = '#a86a00';
        ctx.lineWidth = 1;
        ctx.stroke();

        ctx.restore();

        ctx.save();
        ctx.font = 'bold 10px "Segoe UI"';
        ctx.textAlign = 'center';
        ctx.fillStyle = 'rgba(255,255,255,0.85)';
        ctx.strokeStyle = 'rgba(0,0,0,0.6)';
        ctx.lineWidth = 2;
        ctx.strokeText(t.name, x, y + 26);
        ctx.fillText(t.name, x, y + 26);
        ctx.restore();
    }
}

function drawMenuBackground() {
    drawSky();
    drawGround();
}

/* ============================================================
   ГЛАВНЫЙ ЦИКЛ
   ============================================================ */
let lastTime = 0;
let accumulator = 0;
const STEP = 1000 / 60;

function gameLoop(t) {
    if (!lastTime) lastTime = t;
    let dt = t - lastTime;
    lastTime = t;
    if (dt > 100) dt = 100;

    accumulator += dt;
    let steps = 0;
    while (accumulator >= STEP && steps < 5) {
        if (state.phase !== 'menu') updatePhysics();
        else {
            particles.forEach(p => p.update());
            particles = particles.filter(p => p.life > 0);
            state.time++;
        }
        accumulator -= STEP;
        steps++;
    }

    if (state.phase === 'menu') {
        drawMenuBackground();
    } else {
        draw();
    }
    updateAbilityIndicator();
    requestAnimationFrame(gameLoop);
}

/* ============================================================
   СТАРТ
   ============================================================ */
initBackground();
requestAnimationFrame(gameLoop);
</script>
